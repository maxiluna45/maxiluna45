<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340"
     font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <pattern id="scan3" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0d0d0d"/>
      <rect width="4" height="1" fill="#000000" opacity="0.14"/>
    </pattern>
    <clipPath id="lc"><rect x="0" y="0" width="960" height="340" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="960" height="340" rx="10" fill="#0d0d0d"/>

  <!-- HEADER -->
  <rect x="16" y="12" width="8" height="8" fill="#e6e6e6"/>
  <text x="32" y="20" font-size="14" fill="#e6e6e6" letter-spacing="2">SESSION.LOG</text>
  <rect x="152" y="11" width="8" height="13" fill="#e6e6e6">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="852" y="20" font-size="11" fill="#555555" text-anchor="end">/var/log/career.log</text>

  <!-- pixel-art terminal -->
  <g>
    <rect x="864" y="4" width="40" height="28" fill="#141414" stroke="#3a3a3a"/>
    <rect x="864" y="4" width="40" height="6" fill="#262626"/>
    <rect x="867" y="6" width="2" height="2" fill="#555555"/>
    <rect x="871" y="6" width="2" height="2" fill="#555555"/>
    <rect x="875" y="6" width="2" height="2" fill="#555555"/>
    <rect x="868" y="12" width="32" height="16" fill="#0d0d0d"/>
    <rect x="871" y="15" width="20" height="2" fill="#3a3a3a">
      <animate attributeName="opacity" values="0;1;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="871" y="19" width="14" height="2" fill="#3a3a3a">
      <animate attributeName="opacity" values="0;0;1;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="871" y="23" width="3" height="3" fill="#e6e6e6">
      <animate attributeName="opacity" values="1;1;0;0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="878" y="32" width="12" height="3" fill="#3a3a3a"/>
    <rect x="872" y="35" width="24" height="3" fill="#3a3a3a"/>
  </g>
  <line x1="16" y1="40" x2="944" y2="40" stroke="#262626"/>

  <!-- LEFT : EXPERIENCE -->
  <rect x="16" y="48" width="456" height="196" rx="8" fill="#141414" stroke="#262626"/>
  <rect x="32" y="62" width="7" height="7" fill="#e6e6e6"/>
  <text x="46" y="70" font-size="13" fill="#e6e6e6" letter-spacing="2">EXPERIENCE</text>
  <line x1="32" y1="80" x2="456" y2="80" stroke="#262626"/>

  <text x="32" y="102" font-size="11" fill="#8a8a8a">2024 - NOW</text>
  <circle cx="37" cy="115" r="3" fill="#e6e6e6">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="119" font-size="14" fill="#e6e6e6">OCTUPUS</text>
  <text x="32" y="137" font-size="11" fill="#b0b0b0">Developer Automation Engineer - Full-Stack</text>
  <text x="32" y="155" font-size="11" fill="#8a8a8a">Vue / React / Django / FastAPI / Nest.js</text>
  <text x="32" y="171" font-size="11" fill="#8a8a8a">CI/CD / Jenkins / GitHub Actions / Azure</text>
  <text x="32" y="187" font-size="11" fill="#8a8a8a">Docker / Nginx / Keycloak IAM / PostgreSQL</text>

  <line x1="32" y1="200" x2="456" y2="200" stroke="#202020"/>

  <text x="32" y="220" font-size="11" fill="#8a8a8a">2018 - 2019</text>
  <text x="32" y="238" font-size="14" fill="#e6e6e6">MCAFEE</text>
  <text x="32" y="254" font-size="11" fill="#b0b0b0">Pasantia - Soporte Tecnico / Cordoba, AR</text>

  <!-- RIGHT : PROJECTS -->
  <rect x="488" y="48" width="456" height="196" rx="8" fill="#141414" stroke="#262626"/>
  <rect x="504" y="62" width="7" height="7" fill="#e6e6e6"/>
  <text x="518" y="70" font-size="13" fill="#e6e6e6" letter-spacing="2">PROJECTS</text>
  <line x1="504" y1="80" x2="928" y2="80" stroke="#262626"/>

  <text x="504" y="102" font-size="14" fill="#e6e6e6">FITLOGIC</text>
  <text x="504" y="120" font-size="11" fill="#b0b0b0">SaaS multi-tenant / 3 centros / 200+ usuarios</text>
  <text x="504" y="138" font-size="11" fill="#8a8a8a">Nuxt.js / Prisma / Supabase / Docker</text>
  <text x="504" y="154" font-size="11" fill="#8a8a8a">Analiticas IA / RBAC / Backups / Sentry</text>

  <line x1="504" y1="170" x2="928" y2="170" stroke="#202020"/>

  <text x="504" y="192" font-size="14" fill="#e6e6e6">TRAFFIC-FE</text>
  <text x="504" y="210" font-size="11" fill="#b0b0b0">Deteccion de infracciones / OCR / React</text>
  <text x="504" y="228" font-size="11" fill="#8a8a8a">OCI Identity / JWT / Accesibilidad &lt; 3s</text>

  <!-- BOTTOM : EDUCATION + AWARDS -->
  <rect x="16" y="260" width="928" height="64" rx="8" fill="#141414" stroke="#262626"/>
  <rect x="32" y="274" width="7" height="7" fill="#e6e6e6"/>
  <text x="46" y="282" font-size="13" fill="#e6e6e6" letter-spacing="2">EDUCATION</text>
  <text x="32" y="302" font-size="12" fill="#b0b0b0">UTN FR Cordoba - Ing. en Sistemas de Informacion</text>
  <text x="32" y="318" font-size="11" fill="#8a8a8a">2019 - 2024</text>

  <line x1="620" y1="272" x2="620" y2="312" stroke="#262626"/>

  <rect x="640" y="274" width="7" height="7" fill="#e6e6e6"/>
  <text x="654" y="282" font-size="13" fill="#e6e6e6" letter-spacing="2">AWARDS</text>
  <text x="640" y="302" font-size="12" fill="#b0b0b0">Premio "Ing. Isidoro Marin" / 2025</text>
  <text x="640" y="318" font-size="11" fill="#8a8a8a">1er escolta bandera / prom. 9.51 / tesis 10/10</text>

  <!-- scan overlay + CRT roll -->
  <rect x="0" y="0" width="960" height="340" rx="10" fill="url(#scan3)"/>
  <g clip-path="url(#lc)">
    <rect x="0" y="0" width="960" height="60" fill="#ffffff" opacity="0.03">
      <animateTransform attributeName="transform" type="translate" from="0 -60" to="0 340" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="959" height="339" rx="10" fill="none" stroke="#262626" stroke-width="1"/>
</svg>
