<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220"
     font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <pattern id="scan4" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0d0d0d"/>
      <rect width="4" height="1" fill="#000000" opacity="0.14"/>
    </pattern>
    <clipPath id="sc"><rect x="0" y="0" width="960" height="220" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="960" height="220" rx="10" fill="#0d0d0d"/>

  <!-- HEADER -->
  <rect x="16" y="10" width="8" height="8" fill="#e6e6e6"/>
  <text x="32" y="18" font-size="14" fill="#e6e6e6" letter-spacing="2">STATUS.BAR</text>
  <rect x="140" y="9" width="8" height="12" fill="#e6e6e6">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="944" y="18" font-size="11" fill="#555555" text-anchor="end">v1.0.0 / stable</text>
  <line x1="16" y1="32" x2="944" y2="32" stroke="#262626"/>

  <!-- LEFT : STATUS -->
  <rect x="16" y="44" width="284" height="160" rx="8" fill="#141414" stroke="#262626"/>
  <rect x="32" y="58" width="7" height="7" fill="#e6e6e6"/>
  <text x="46" y="66" font-size="13" fill="#e6e6e6" letter-spacing="2">STATUS</text>
  <line x1="32" y1="76" x2="284" y2="76" stroke="#262626"/>

  <text x="32" y="100" font-size="11" fill="#8a8a8a">MODE</text>
  <text x="284" y="100" font-size="11" fill="#e6e6e6" text-anchor="end">REMOTE</text>
  <text x="32" y="122" font-size="11" fill="#8a8a8a">BASE</text>
  <text x="284" y="122" font-size="11" fill="#e6e6e6" text-anchor="end">CORDOBA, AR</text>
  <text x="32" y="144" font-size="11" fill="#8a8a8a">ROLE</text>
  <text x="284" y="144" font-size="11" fill="#e6e6e6" text-anchor="end">DEVOPS+FULLSTACK</text>
  <line x1="32" y1="160" x2="284" y2="160" stroke="#202020"/>
  <circle cx="37" cy="182" r="4" fill="#e6e6e6">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="186" font-size="12" fill="#e6e6e6" letter-spacing="1">OPEN TO WORK</text>

  <!-- MIDDLE : CAPACITY -->
  <rect x="316" y="44" width="328" height="160" rx="8" fill="#141414" stroke="#262626"/>
  <rect x="332" y="58" width="7" height="7" fill="#e6e6e6"/>
  <text x="346" y="66" font-size="13" fill="#e6e6e6" letter-spacing="2">CAPACITY</text>
  <g transform="translate(604,52)">
    <path d="M0,0 L0,16 L4,12 L7,18 L10,17 L7,11 L12,11 Z" fill="#e6e6e6"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,6;0,0" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <line x1="332" y1="76" x2="628" y2="76" stroke="#262626"/>

  <text x="332" y="104" font-size="11" fill="#b0b0b0">BACKEND</text>
  <rect x="400" y="96" width="180" height="12" fill="#1a1a1a" stroke="#262626"/>
  <rect x="400" y="96" width="153" height="12" fill="#e6e6e6"/>
  <g stroke="#0d0d0d" stroke-width="1">
    <line x1="418" y1="96" x2="418" y2="108"/><line x1="436" y1="96" x2="436" y2="108"/>
    <line x1="454" y1="96" x2="454" y2="108"/><line x1="472" y1="96" x2="472" y2="108"/>
    <line x1="490" y1="96" x2="490" y2="108"/><line x1="508" y1="96" x2="508" y2="108"/>
    <line x1="526" y1="96" x2="526" y2="108"/><line x1="544" y1="96" x2="544" y2="108"/>
    <line x1="562" y1="96" x2="562" y2="108"/>
  </g>
  <text x="628" y="104" font-size="11" fill="#8a8a8a" text-anchor="end">85%</text>

  <text x="332" y="132" font-size="11" fill="#b0b0b0">FRONTEND</text>
  <rect x="400" y="124" width="180" height="12" fill="#1a1a1a" stroke="#262626"/>
  <rect x="400" y="124" width="144" height="12" fill="#e6e6e6"/>
  <g stroke="#0d0d0d" stroke-width="1">
    <line x1="418" y1="124" x2="418" y2="136"/><line x1="436" y1="124" x2="436" y2="136"/>
    <line x1="454" y1="124" x2="454" y2="136"/><line x1="472" y1="124" x2="472" y2="136"/>
    <line x1="490" y1="124" x2="490" y2="136"/><line x1="508" y1="124" x2="508" y2="136"/>
    <line x1="526" y1="124" x2="526" y2="136"/><line x1="544" y1="124" x2="544" y2="136"/>
    <line x1="562" y1="124" x2="562" y2="136"/>
  </g>
  <text x="628" y="132" font-size="11" fill="#8a8a8a" text-anchor="end">80%</text>

  <text x="332" y="160" font-size="11" fill="#b0b0b0">DEVOPS</text>
  <rect x="400" y="152" width="180" height="12" fill="#1a1a1a" stroke="#262626"/>
  <rect x="400" y="152" width="162" height="12" fill="#e6e6e6"/>
  <g stroke="#0d0d0d" stroke-width="1">
    <line x1="418" y1="152" x2="418" y2="164"/><line x1="436" y1="152" x2="436" y2="164"/>
    <line x1="454" y1="152" x2="454" y2="164"/><line x1="472" y1="152" x2="472" y2="164"/>
    <line x1="490" y1="152" x2="490" y2="164"/><line x1="508" y1="152" x2="508" y2="164"/>
    <line x1="526" y1="152" x2="526" y2="164"/><line x1="544" y1="152" x2="544" y2="164"/>
    <line x1="562" y1="152" x2="562" y2="164"/>
  </g>
  <text x="628" y="160" font-size="11" fill="#8a8a8a" text-anchor="end">90%</text>

  <!-- RIGHT : CONTACT -->
  <rect x="660" y="44" width="284" height="160" rx="8" fill="#141414" stroke="#262626"/>
  <rect x="676" y="58" width="7" height="7" fill="#e6e6e6"/>
  <text x="690" y="66" font-size="13" fill="#e6e6e6" letter-spacing="2">CONTACT</text>
  <line x1="676" y1="76" x2="928" y2="76" stroke="#262626"/>

  <text x="676" y="100" font-size="10"><tspan fill="#8a8a8a">MAIL     </tspan><tspan fill="#e6e6e6">lunamaximiliano.sistemas@gmail.com</tspan></text>
  <text x="676" y="124" font-size="10"><tspan fill="#8a8a8a">LINKEDIN </tspan><tspan fill="#e6e6e6">in/luna-maximiliano</tspan></text>
  <text x="676" y="148" font-size="10"><tspan fill="#8a8a8a">GITHUB   </tspan><tspan fill="#e6e6e6">github.com/maxiluna45</tspan></text>
  <text x="676" y="172" font-size="10"><tspan fill="#8a8a8a">BASE     </tspan><tspan fill="#e6e6e6">Cordoba, AR</tspan></text>
  <line x1="676" y1="184" x2="928" y2="184" stroke="#202020"/>
  <circle cx="681" cy="198" r="4" fill="#e6e6e6">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="694" y="202" font-size="12" fill="#e6e6e6" letter-spacing="1">CONNECT</text>

  <!-- scan overlay + CRT roll -->
  <rect x="0" y="0" width="960" height="220" rx="10" fill="url(#scan4)"/>
  <g clip-path="url(#sc)">
    <rect x="0" y="0" width="960" height="50" fill="#ffffff" opacity="0.03">
      <animateTransform attributeName="transform" type="translate" from="0 -50" to="0 220" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="959" height="219" rx="10" fill="none" stroke="#262626" stroke-width="1"/>
</svg>
