      <text x="72" y="182" font-size="13" fill="#e6edf3"><tspan fill="#9aa7b4">    </tspan><tspan fill="#58f0a8">"main"</tspan><tspan fill="#9aa7b4">: </tspan><tspan fill="#e6c56a">"counter-strike"</tspan><tspan fill="#9aa7b4">,</tspan></text>
      <text x="52" y="200" font-size="12" fill="#3a4a55" text-anchor="end">9</text>
