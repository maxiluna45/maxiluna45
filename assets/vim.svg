      <text x="72" y="128" font-size="13" fill="#e6edf3"><tspan fill="#9aa7b4">  </tspan><tspan fill="#58f0a8">"piano"</tspan><tspan fill="#9aa7b4">: </tspan><tspan fill="#e6c56a">"el unico stack sin stack traces"</tspan><tspan fill="#9aa7b4">,</tspan></text>
      <text x="52" y="146" font-size="12" fill="#3a4a55" text-anchor="end">6</text>
      <text x="72" y="146" font-size="13" fill="#e6edf3"><tspan fill="#9aa7b4">  </tspan><tspan fill="#58f0a8">"futbol"</tspan><tspan fill="#9aa7b4">: </tspan><tspan fill="#6ad1e3">true</tspan><tspan fill="#9aa7b4">,</tspan></text>
