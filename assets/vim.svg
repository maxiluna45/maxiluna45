      <text x="72" y="56" font-size="13" fill="#e6edf3"><tspan fill="#5b6a77">// vim: syntax=jsonc — lo que el CV no cuenta</tspan></text>
      <text x="52" y="74" font-size="12" fill="#3a4a55" text-anchor="end">2</text>
