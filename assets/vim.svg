      <text x="52" y="218" font-size="12" fill="#3a4a55" text-anchor="end">10</text>
      <text x="72" y="218" font-size="13" fill="#e6edf3"><tspan fill="#9aa7b4">  </tspan><tspan fill="#9aa7b4">},</tspan></text>
      <text x="52" y="236" font-size="12" fill="#3a4a55" text-anchor="end">11</text>
      <text x="72" y="236" font-size="13" fill="#e6edf3"><tspan fill="#9aa7b4">  </tspan><tspan fill="#58f0a8">"roadmap"</tspan><tspan fill="#9aa7b4">: [</tspan><tspan fill="#e6c56a">"ia aplicada / agentes"</tspan><tspan fill="#9aa7b4">, </tspan><tspan fill="#e6c56a">"producto propio en produccion"</tspan><tspan fill="#9aa7b4">],</tspan></text>
      <text x="52" y="254" font-size="12" fill="#3a4a55" text-anchor="end">12</text>
      <text x="72" y="254" font-size="13" fill="#e6edf3"><tspan fill="#9aa7b4">  </tspan><tspan fill="#58f0a8">"deploy_viernes"</tspan><tspan fill="#9aa7b4">: </tspan><tspan fill="#6ad1e3">false</tspan><tspan fill="#9aa7b4">,</tspan></text>
      <text x="52" y="272" font-size="12" fill="#3a4a55" text-anchor="end">13</text>
      <text x="72" y="272" font-size="13" fill="#e6edf3"><tspan fill="#9aa7b4">  </tspan><tspan fill="#58f0a8">"works_on_my_machine"</tspan><tspan fill="#9aa7b4">: </tspan><tspan fill="#6ad1e3">true</tspan><tspan fill="#9aa7b4">,</tspan></text>
      <text x="52" y="290" font-size="12" fill="#3a4a55" text-anchor="end">14</text>
      <text x="72" y="290" font-size="13" fill="#e6edf3"><tspan fill="#9aa7b4">  </tspan><tspan fill="#58f0a8">"TODO"</tspan><tspan fill="#9aa7b4">: </tspan><tspan fill="#e6c56a">"refactorizar esto (desde 2024)"</tspan><tspan fill="#9aa7b4">,</tspan></text>
      <text x="52" y="308" font-size="12" fill="#3a4a55" text-anchor="end">15</text>
      <text x="72" y="308" font-size="13" fill="#e6edf3"><tspan fill="#9aa7b4">  </tspan><tspan fill="#58f0a8">"coffee_to_code_ratio"</tspan><tspan fill="#9aa7b4">: </tspan><tspan fill="#6ad1e3">1.618</tspan></text>
