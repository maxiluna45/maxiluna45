<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="60" height="60" fill="#111"/>
  <rect x="10" y="10" width="40" height="40" fill="none" stroke="#fff" stroke-width="2">
    <animate attributeName="stroke-dasharray" values="0,160;160,0" dur="2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="30" cy="30" r="8" fill="#fff">
    <animate attributeName="r" values="4;12;4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
